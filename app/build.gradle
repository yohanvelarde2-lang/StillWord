plugins { id 'com.android.application' }
android {
 namespace 'org.lockheart.abide'
 compileSdk 35
 defaultConfig { applicationId 'org.lockheart.abide'; minSdk 26; targetSdk 35; versionCode 4; versionName '0.2.2' }
 signingConfigs { development { storeFile file('../development.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
 buildTypes { debug { applicationIdSuffix ''; signingConfig signingConfigs.development } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
